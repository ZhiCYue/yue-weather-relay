name: Push News to WeChat Work
on:
  workflow_dispatch:
    inputs:
      content:
        description: Markdown content
        required: true
        type: string
  schedule:
    # 08:30 Asia/Shanghai. GitHub cron is evaluated in UTC.
    - cron: "30 0 * * *"
  push:
    paths: [news.md]

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Resolve content
        env:
          INPUT_CONTENT: ${{ github.event.inputs.content }}
        run: |
          if [ -n "$INPUT_CONTENT" ]; then
            printf '%s' "$INPUT_CONTENT" > /tmp/msg.md
          else
            cp news.md /tmp/msg.md
          fi
      - name: Send
        env:
          WEBHOOK: ${{ secrets.WECHAT_WEBHOOK_NEWS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          webhook = os.environ.get("WEBHOOK", "").strip()
          if not webhook:
              raise SystemExit("Missing WECHAT_WEBHOOK_NEWS secret.")

          content = open('/tmp/msg.md', encoding='utf-8').read()
          if not content.strip():
              raise SystemExit("Message content is empty.")

          payload = json.dumps({"msgtype":"markdown","markdown":{"content":content}}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(webhook, data=payload,
                                        headers={"Content-Type":"application/json"})
          resp = urllib.request.urlopen(req, timeout=15).read().decode()
          print(resp)
          data = json.loads(resp)
          if data.get("errcode") != 0:
              raise SystemExit(f"WeChat error: {resp}")
          PY

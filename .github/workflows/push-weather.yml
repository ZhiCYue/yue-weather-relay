name: Push Weather to WeChat Work
on:
  workflow_dispatch:
    inputs:
      content:
        description: Markdown content
        required: false
        type: string
  schedule:
    # 07:30 Asia/Shanghai. GitHub cron is evaluated in UTC.
    - cron: "30 23 * * *"
  push:
    paths: [weather.md]

permissions:
  contents: write

concurrency:
  group: push-weather
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      MESSAGE_FILE: weather.md
    steps:
      - uses: actions/checkout@v4
      - name: Generate content with AI
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.content == '')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          MESSAGE_KIND: weather
          OUTPUT_FILE: weather.md
          MAX_MESSAGE_BYTES: 3900
        run: python3 scripts/generate_message.py
      - name: Resolve content
        env:
          INPUT_CONTENT: ${{ github.event.inputs.content }}
        run: |
          if [ -n "$INPUT_CONTENT" ]; then
            printf '%s' "$INPUT_CONTENT" > /tmp/msg.md
            cp /tmp/msg.md "$MESSAGE_FILE"
          else
            cp "$MESSAGE_FILE" /tmp/msg.md
          fi
      - name: Send
        env:
          WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          WEBHOOK_SECRET_NAME: WECHAT_WEBHOOK
          MESSAGE_FILE: /tmp/msg.md
        run: python3 scripts/send_wechat.py
      - name: Commit generated content
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- "$MESSAGE_FILE"; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "ai-scheduler"
          git config user.email "actions@github.com"
          git add "$MESSAGE_FILE"
          git commit -m "weather: $(date +%F) [skip ci]"
          git pull --rebase
          git push
